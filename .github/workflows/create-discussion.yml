name: Create Daily Discussion

on:
  workflow_dispatch:  # Allows manual triggering
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC

jobs:
  create-discussion:
    runs-on: ubuntu-latest
    permissions:
      discussions: write
      contents: read
    
    steps:
      - name: Get current date and time
        id: datetime
        run: |
          echo "datetime=$(date '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT
      
      - name: Get repository ID
        id: get_repo_id
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO_ID=$(gh api graphql -f query='
            query {
              repository(owner: "${{ github.repository_owner }}", name: "${{ github.event.repository.name }}") {
                id
              }
            }
          ' --jq '.data.repository.id')
          echo "repo_id=$REPO_ID" >> $GITHUB_OUTPUT
      
      - name: Get first discussion category ID
        id: get_category_id
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CATEGORY_ID=$(gh api graphql -f query='
            query {
              repository(owner: "${{ github.repository_owner }}", name: "${{ github.event.repository.name }}") {
                discussionCategories(first: 1) {
                  nodes {
                    id
                  }
                }
              }
            }
          ' --jq '.data.repository.discussionCategories.nodes[0].id')
          echo "category_id=$CATEGORY_ID" >> $GITHUB_OUTPUT
      
      - name: Create discussion
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api graphql -f query='
            mutation {
              createDiscussion(input: {
                repositoryId: "${{ steps.get_repo_id.outputs.repo_id }}",
                categoryId: "${{ steps.get_category_id.outputs.category_id }}",
                title: "${{ steps.datetime.outputs.datetime }}",
                body: "This discussion was automatically created by GitHub Actions."
              }) {
                discussion {
                  id
                  title
                  url
                }
              }
            }
          '
      
      - name: Display result
        run: |
          echo "Discussion created with title: ${{ steps.datetime.outputs.datetime }}"
