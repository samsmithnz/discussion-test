name: Create Daily Discussion

on:
  workflow_dispatch:  # Allows manual triggering
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC

jobs:
  create-discussion:
    runs-on: ubuntu-latest
    permissions:
      discussions: write
      contents: read
    
    steps:
      - name: Get current date and time
        id: datetime
        run: |
          echo "datetime=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT
      
      - name: Get repository ID
        id: get_repo_id
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO_ID=$(gh api graphql \
            -F owner='${{ github.repository_owner }}' \
            -F name='${{ github.event.repository.name }}' \
            -f query='
              query($owner: String!, $name: String!) {
                repository(owner: $owner, name: $name) {
                  id
                }
              }
            ' --jq '.data.repository.id')
          if [ -z "$REPO_ID" ] || [ "$REPO_ID" = "null" ]; then
            echo "Error: Could not retrieve repository ID"
            exit 1
          fi
          echo "repo_id=$REPO_ID" >> $GITHUB_OUTPUT
      
      - name: Get first discussion category ID
        id: get_category_id
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CATEGORY_ID=$(gh api graphql \
            -F owner='${{ github.repository_owner }}' \
            -F name='${{ github.event.repository.name }}' \
            -f query='
              query($owner: String!, $name: String!) {
                repository(owner: $owner, name: $name) {
                  discussionCategories(first: 1) {
                    nodes {
                      id
                    }
                  }
                }
              }
            ' --jq '.data.repository.discussionCategories.nodes[0].id')
          if [ -z "$CATEGORY_ID" ] || [ "$CATEGORY_ID" = "null" ]; then
            echo "Error: No discussion categories found in the repository"
            echo "Please enable discussions and create at least one category"
            exit 1
          fi
          echo "category_id=$CATEGORY_ID" >> $GITHUB_OUTPUT
      
      - name: Create discussion
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api graphql \
            -F repositoryId='${{ steps.get_repo_id.outputs.repo_id }}' \
            -F categoryId='${{ steps.get_category_id.outputs.category_id }}' \
            -F title='${{ steps.datetime.outputs.datetime }}' \
            -F body='This discussion was automatically created by GitHub Actions.' \
            -f query='
              mutation($repositoryId: ID!, $categoryId: ID!, $title: String!, $body: String!) {
                createDiscussion(input: {
                  repositoryId: $repositoryId,
                  categoryId: $categoryId,
                  title: $title,
                  body: $body
                }) {
                  discussion {
                    id
                    title
                    url
                  }
                }
              }
            '
      
      - name: Display result
        run: |
          echo "Discussion created with title: ${{ steps.datetime.outputs.datetime }}"
